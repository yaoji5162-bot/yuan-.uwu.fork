plugins { id 'com.android.application' }

android {
    namespace 'com.yaoji.uwu'
    compileSdk 35
    defaultConfig {
        applicationId 'com.yaoji.uwu'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }
    // First personal test build. Keep its private signing key outside Git.
    signingConfigs {
        personal {
            def keyPath = System.getenv('YUAN_KEYSTORE')
            if (keyPath) {
                storeFile file(keyPath)
                storePassword System.getenv('YUAN_STORE_PASSWORD')
                keyAlias System.getenv('YUAN_KEY_ALIAS') ?: 'yuan'
                keyPassword System.getenv('YUAN_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (System.getenv('YUAN_KEYSTORE')) signingConfig signingConfigs.personal
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies { implementation 'androidx.webkit:webkit:1.12.1' }
