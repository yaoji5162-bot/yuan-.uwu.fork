name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', 'scripts/prepare-android.mjs', '.github/workflows/android-apk.yml', 'js/**', 'css/**', 'src/**']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: npm ci --ignore-scripts
      - run: node scripts/prepare-android.mjs
      - run: npm run check
      - name: Check packaged web app
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          OVO_TEST_CHROMIUM=/usr/bin/google-chrome node scripts/test-android-browser.mjs
      - name: Restore personal signing key when configured
        env:
          KEYSTORE: ${{ secrets.YUAN_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/yuan.jks"
            echo "YUAN_KEYSTORE=$RUNNER_TEMP/yuan.jks" >> "$GITHUB_ENV"
          fi
      - name: Build and lint
        env:
          YUAN_STORE_PASSWORD: ${{ secrets.YUAN_STORE_PASSWORD }}
          YUAN_KEY_PASSWORD: ${{ secrets.YUAN_KEY_PASSWORD }}
          YUAN_KEY_ALIAS: yuan
        run: gradle -p android assembleRelease lintRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: UwU-Android
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Explain signing
        run: |
          echo 'The release APK is installable only when YUAN_KEYSTORE_BASE64 and password secrets are configured. Otherwise the artifact is explicitly unsigned. Keep the original personal signing key for updates.' >> "$GITHUB_STEP_SUMMARY"
